# distrobox-assemble manifest: WayRay SERVER side (Topology A).
#
# Runs the headless compositor (wrsrvd) and Wayland test apps inside a Debian
# container that is tightly integrated with your Linux host (shared $HOME, so
# the repo at its usual path and your host ~/.cargo / ~/.rustup are visible
# inside the box) but keeps the heavy Wayland/pixman/Mesa dev dependency tree
# OUT of your host system.
#
# distrobox shares the host network namespace, so a server that binds
# 0.0.0.0:4433 inside the box is reachable at this host's LAN IP — that is how
# your macOS machine connects as the thin client (no port mapping needed; just
# open 4433/udp in the host firewall).
#
# Create:  distrobox assemble create --file dev/distrobox/wayray-server.ini
# Enter:   distrobox enter wayray-server
# Remove:  distrobox rm wayray-server

[wayray-server]
image=debian:bookworm
pull=true
# Build + runtime deps for the Linux server build (mirrors docker/Dockerfile):
#  - Smithay (renderer_pixman): libwayland, libpixman, libxkbcommon
#  - misc linking: libudev, libx11, libxcb
#  - foot / weston: real Wayland apps to give the compositor content to stream
#  - build-essential/pkg-config/curl: toolchain glue (Rust itself comes from
#    your host's rustup via the shared $HOME; install in-box only if absent)
additional_packages="pkg-config build-essential curl ca-certificates libwayland-dev libpixman-1-dev libxkbcommon-dev libudev-dev libx11-dev libxcb1-dev foot weston"
