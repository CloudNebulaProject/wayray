# Static multi-server cluster config (Phase 3.6).
#
# WayRay deliberately avoids mDNS/DNS-SD (unreliable inside illumos zones and on
# segmented networks) in favour of a static TOML topology -- zero extra deps,
# identical on illumos and Linux. This file makes wrsrvd start in clustered
# mode so the multi-server code paths (session registry placement / redirect)
# are exercised even in this single-node test deployment.
local_id = "srv-a"

# Shared secret authenticating intra-cluster control probes (ServerInfo /
# SessionLookup). Every server in the cluster must use the same value; without
# it a server refuses to answer peer probes (secure-by-default), which also
# closes the token-existence oracle. Use a real secret in production.
cluster_secret = "wayray-demo-cluster-secret"

[[servers]]
id = "srv-a"
addr = "wrsrvd:4433"
# Optionally pin each server's TLS cert fingerprint (sha256:<hex>) for strict
# verification; the server logs its fingerprint at startup. When omitted,
# clients/peers trust-on-first-use and record it in known_hosts.
# fingerprint = "sha256:..."
weight = 1

# A second, intentionally-unreachable peer so load-balancing / placement logic
# has more than one candidate to reason about. New-session placement and
# token-redirect queries against this peer will simply time out and fall back
# to the local server, which is the expected graceful-degradation behaviour.
[[servers]]
id = "srv-b"
addr = "wrsrvd-peer:4433"
weight = 2
